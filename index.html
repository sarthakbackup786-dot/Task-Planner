<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Planner</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f9}
header{background:#2563eb;color:white;padding:20px;text-align:center}
.hero img{width:100%;height:300px;object-fit:cover}
.container{max-width:1000px;margin:auto;padding:20px}
.dashboard{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:20px}
.card,.form-box,.task-box{background:white;padding:20px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.card{text-align:center}
.card h2{margin:0;color:#2563eb}
input,select{padding:10px;margin:5px;width:220px}
button{padding:10px 15px;border:none;border-radius:5px;cursor:pointer}
.add-btn{background:#2563eb;color:#fff}
.complete-btn{background:#16a34a;color:#fff}
.delete-btn{background:#dc2626;color:#fff}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;border-bottom:1px solid #ddd}
th{background:#f8fafc}
.completed{text-decoration:line-through;color:gray}
.task-icon{width:24px;height:24px;vertical-align:middle;margin-right:8px}
.priority-high{color:red;font-weight:bold}
.priority-medium{color:orange;font-weight:bold}
.priority-low{color:green;font-weight:bold}
</style>
</head>
<body>
<header><h1>📋 Task Planner & To‑Do List</h1></header>

<div class="hero">
<img src="https://images.unsplash.com/photo-1484480974693-6ca0a78fb36b?w=1200" alt="Task Planner">
</div>

<div class="container">
<div class="dashboard">
<div class="card"><h2 id="totalTasks">0</h2><p>Total Tasks</p></div>
<div class="card"><h2 id="pendingTasks">0</h2><p>Pending</p></div>
<div class="card"><h2 id="completedTasks">0</h2><p>Completed</p></div>
</div>

<div class="form-box">
<h3>Add New Task</h3>
<input type="text" id="taskName" placeholder="Task Name">
<select id="priority">
<option value="High">High Priority</option>
<option value="Medium">Medium Priority</option>
<option value="Low">Low Priority</option>
</select>
<input type="date" id="dueDate">
<button class="add-btn" onclick="addTask()">Add Task</button>
</div>

<div class="task-box">
<input type="text" id="search" placeholder="Search Tasks..." onkeyup="renderTasks()" style="width:300px;">
<br><br>
<table>
<thead>
<tr><th>Task</th><th>Priority</th><th>Due Date</th><th>Status</th><th>Actions</th></tr>
</thead>
<tbody id="taskTable"></tbody>
</table>
</div>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

function saveTasks(){localStorage.setItem("tasks", JSON.stringify(tasks));}

function addTask(){
 const taskName=document.getElementById("taskName").value;
 const priority=document.getElementById("priority").value;
 const dueDate=document.getElementById("dueDate").value;
 if(!taskName){alert("Please enter a task.");return;}
 tasks.push({taskName,priority,dueDate,completed:false});
 saveTasks(); renderTasks();
 document.getElementById("taskName").value="";
}

function toggleTask(i){tasks[i].completed=!tasks[i].completed;saveTasks();renderTasks();}
function deleteTask(i){tasks.splice(i,1);saveTasks();renderTasks();}

function renderTasks(){
 const search=document.getElementById("search").value.toLowerCase();
 const table=document.getElementById("taskTable");
 table.innerHTML="";
 tasks.forEach((task,index)=>{
  if(!task.taskName.toLowerCase().includes(search)) return;
  let pc=task.priority==="High"?"priority-high":task.priority==="Medium"?"priority-medium":"priority-low";
  table.innerHTML += `
  <tr>
   <td class="${task.completed?'completed':''}">
   <img class="task-icon" src="https://cdn-icons-png.flaticon.com/512/1828/1828919.png" alt="Task">
   ${task.taskName}</td>
   <td class="${pc}">${task.priority}</td>
   <td>${task.dueDate || "-"}</td>
   <td>${task.completed?'Completed':'Pending'}</td>
   <td>
    <button class="complete-btn" onclick="toggleTask(${index})">✓</button>
    <button class="delete-btn" onclick="deleteTask(${index})">✕</button>
   </td>
  </tr>`;
 });
 document.getElementById("totalTasks").innerText=tasks.length;
 document.getElementById("completedTasks").innerText=tasks.filter(t=>t.completed).length;
 document.getElementById("pendingTasks").innerText=tasks.filter(t=>!t.completed).length;
}
renderTasks();
</script>
</body>
</html>
